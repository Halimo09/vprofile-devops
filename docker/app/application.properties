# MySQL JDBC driver used by the existing Java application.
jdbc.driverClassName=com.mysql.jdbc.Driver

# Connect to the MariaDB service using the Docker Compose service name.
# Values inside ${...} are read from runtime environment variables.
jdbc.url=jdbc:mysql://${DB_HOST:database}:${DB_PORT:3306}/${DB_NAME:accounts}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull

# Read the database username from a runtime environment variable.
jdbc.username=${DB_USER}

# Read the database password from a runtime environment variable.
jdbc.password=${DB_PASSWORD}

# Use the Memcached Docker Compose service as the active cache server.
memcached.active.host=${MEMCACHED_HOST:memcached}

# Use the standard Memcached TCP port.
memcached.active.port=${MEMCACHED_PORT:11211}

# Use the same Memcached container as the standby server for this simple lab.
memcached.standBy.host=${MEMCACHED_HOST:memcached}

# Use the standard Memcached TCP port for the standby configuration.
memcached.standBy.port=${MEMCACHED_PORT:11211}

# Use the RabbitMQ Docker Compose service name.
rabbitmq.address=${RABBITMQ_HOST:rabbitmq}

# Use the standard RabbitMQ AMQP port.
rabbitmq.port=${RABBITMQ_PORT:5672}

# Read the RabbitMQ username from a runtime environment variable.
rabbitmq.username=${RABBITMQ_USER}

# Read the RabbitMQ password from a runtime environment variable.
rabbitmq.password=${RABBITMQ_PASSWORD}

# Elasticsearch is not deployed, but these values must remain defined
# because the existing application references them during startup.
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}

# Default Elasticsearch transport port expected by the old application.
elasticsearch.port=${ELASTICSEARCH_PORT:9300}

# Default Elasticsearch cluster name.
elasticsearch.cluster=${ELASTICSEARCH_CLUSTER:vprofile}

# Default Elasticsearch node name.
elasticsearch.node=${ELASTICSEARCH_NODE:vprofilenode}
