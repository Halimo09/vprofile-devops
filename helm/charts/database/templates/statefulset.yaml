apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "database.fullname" . }}

spec:
  serviceName: {{ include "database.fullname" . }}
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "database.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "database.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      securityContext:
        fsGroup: 999

      containers:
        - name: mariadb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 3306

          envFrom:
            - secretRef:
                name: {{ include "database.fullname" . }}-secret

          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql

          readinessProbe:
            tcpSocket:
              port: 3306

          livenessProbe:
            tcpSocket:
              port: 3306

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ .Values.storageClass }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size }}