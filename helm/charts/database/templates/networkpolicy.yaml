apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database.fullname" . }}-policy
  labels:
    {{- include "database.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "database.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
      ports:
        - protocol: TCP
          port: 3306